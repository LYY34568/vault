workflows:
  android-release:
    name: Vault Android Release
    max_build_duration: 15
    environment:
      flutter: stable
    scripts:
      - flutter --version
      #
      - flutter create --platforms=android .
      - flutter pub get
      - flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - your_email@example.com
